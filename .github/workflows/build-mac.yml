name: Build macOS app

# Builds BlueprintTB.app on a macOS runner. Originally ran an Intel
# (macos-13) leg alongside Apple Silicon (macos-14) so both chip types got
# a working build automatically -- but GitHub has not been allocating the
# macos-13 runner image for this repo (every run sat "queued" for the full
# 24h timeout and was auto-cancelled), so it's dropped for now. Re-add it
# once GitHub-hosted Intel runners are confirmed working again for this
# account. PyInstaller doesn't cross-compile, so a restored Intel leg would
# again be a genuinely separate build, not a universal2 one.
#
# Trigger manually from the Actions tab ("Run workflow"), or it runs
# automatically on every push to main.
#
# After a run finishes, download the results from the workflow run's
# Summary page under "Artifacts".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14       # Apple Silicon (arm64) hosted runner
            arch_label: apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        run: bash scripts/build_mac.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueprintTB-mac-${{ matrix.arch_label }}
          path: |
            dist/*.zip
            dist/How to Install.md
          if-no-files-found: error

      - name: Build .pkg installer
        # pkgbuild ships with every macOS runner (part of the Xcode Command
        # Line Tools) -- this produces a standard double-clickable Apple
        # installer package, same format as Zoom.pkg / MicrosoftTeams.pkg,
        # so opening it is something students have already done before.
        # It still needs one right-click -> Open past Gatekeeper the first
        # time (this is an unsigned package, no paid Apple Developer
        # account) -- everything after that is normal Installer.app clicks
        # (Continue / Install / Close), no Terminal at any point.
        run: |
          VERSION=$(grep -oE '^APP_VERSION = "[^"]+"' blueprinttb/constants.py | sed -E 's/APP_VERSION = "(.*)"/\1/')
          rm -rf pkgroot pkgscripts
          mkdir -p pkgroot/Applications pkgscripts
          cp -R dist/BlueprintTB.app pkgroot/Applications/
          cat > pkgscripts/preinstall << 'SCRIPT'
          #!/bin/bash
          # The product was previously named ATBWorkup, installed as its own
          # .app bundle -- remove it so upgrading is a clean one-step swap
          # instead of leaving a stale ATBWorkup.app behind.
          rm -rf "/Applications/ATBWorkup.app"
          exit 0
          SCRIPT
          chmod +x pkgscripts/preinstall
          pkgbuild \
            --root pkgroot \
            --scripts pkgscripts \
            --identifier tax.zbcpa.blueprinttb \
            --version "$VERSION" \
            --install-location / \
            "dist/BlueprintTB-Installer-${{ matrix.arch_label }}.pkg"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueprintTB-installer-${{ matrix.arch_label }}
          path: |
            dist/BlueprintTB-Installer-${{ matrix.arch_label }}.pkg
            dist/How to Install.md
          if-no-files-found: error
